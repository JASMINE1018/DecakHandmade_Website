<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img">
    
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F7F1E9" />
            <stop offset="1" stop-color="#E8DBCA" />
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7C4E34" />
            <stop offset="1" stop-color="#5A2A18" />
        </linearGradient>
        <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6D402B" />
            <stop offset="1" stop-color="#5A2A18" />
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4A2414" flood-opacity=".24" />
        </filter>
        <pattern id="weave" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M0 0H22M0 11H22" stroke="#43200F" stroke-width="1" opacity=".16" />
        </pattern>
        <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.2" fill="#E7D2BC" opacity=".13" />
        </pattern>
    </defs>
    
    <rect width="1200" height="1200" fill="url(#bg)" />
    <rect width="1200" height="1200" fill="url(#dots)" opacity=".55" />
    <circle cx="1010" cy="185" r="255" fill="#E0CFBA" opacity=".62" />
    <circle cx="160" cy="1000" r="235" fill="#EADCCB" opacity=".65" />
    <circle cx="965" cy="995" r="120" fill="#E0CFBA" opacity=".38" />

    <g transform="rotate(-6 600 600)" filter="url(#softShadow)">
        <!-- Close-up canvas panel -->
        <rect x="-80" y="270" width="1360" height="690" rx="48" fill="url(#body)" stroke="#43200F" stroke-width="6" />
        <rect x="-80" y="270" width="1360" height="690" rx="48" fill="url(#weave)" opacity=".9" />

        <!-- Top hem band -->
        <rect x="-80" y="270" width="1360" height="112" rx="48" fill="#6B3D27" opacity=".8" />
        <rect x="-80" y="344" width="1360" height="38" fill="#6B3D27" opacity=".8" />
        <line x1="0" y1="382" x2="1200" y2="382" stroke="#D0A37E" stroke-width="5" stroke-dasharray="14 11" opacity=".9" />

        <!-- Pocket panel with top seam -->
        <rect x="-80" y="610" width="1360" height="350" rx="40" fill="url(#pocket)" stroke="#8A5B41" stroke-width="4" />
        <line x1="0" y1="624" x2="1200" y2="624" stroke="#D0A37E" stroke-width="4" stroke-dasharray="12 10" opacity=".8" />
        <rect x="-80" y="610" width="1360" height="350" rx="40" fill="url(#weave)" opacity=".6" />

        <!-- Vertical side seam -->
        <line x1="205" y1="300" x2="205" y2="960" stroke="#D0A37E" stroke-width="4" stroke-dasharray="13 12" opacity=".65" />

        <!-- Label patch -->
        
    <rect x="495" y="690" width="210" height="132" rx="10" fill="#F3E4D0" stroke="#8A5B41" stroke-width="3" />
    <text x="600" y="724" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#5A2A18">DECAK</text>
    <line x1="521" y1="735" x2="679" y2="735" stroke="#8A5B41" stroke-width="1.5" opacity=".7" />
    <text x="600" y="754" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="2.4" fill="#5A2A18">HANDMADE</text>

        <!-- Fabric movement -->
        <path d="M320 420 C430 470 560 472 690 430 C830 386 960 396 1080 448" fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".06" stroke-linecap="round" />
        <path d="M180 860 C360 900 560 884 740 848 C900 816 1040 824 1160 866" fill="none" stroke="#43200F" stroke-width="3" opacity=".2" stroke-linecap="round" />
    </g>

    <!-- Editorial annotations -->
    <circle cx="1010" cy="196" r="86" fill="none" stroke="#E7D2BC" stroke-width="2" opacity=".55" />
    <circle cx="1010" cy="196" r="70" fill="none" stroke="#E7D2BC" stroke-width="1" stroke-dasharray="4 7" opacity=".5" />
    <text x="1010" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#E7D2BC">12 OZ</text>
    <text x="1010" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.8" fill="#E7D2BC" opacity=".8">COTTON CANVAS</text>

</svg>